<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a3d2c"/>
      <stop offset="60%" stop-color="#072a1e"/>
      <stop offset="100%" stop-color="#041810"/>
    </radialGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular luxury medallion -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#goldGrad1)" stroke-width="6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#goldGrad2)" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5"/>

  <!-- Ornate Crown at top -->
  <g transform="translate(140, 48) scale(0.6)" fill="url(#goldGrad1)" filter="url(#glow)">
    <path d="M 100 40 L 130 90 L 170 30 L 150 110 L 50 110 L 30 30 L 70 90 Z"/>
    <circle cx="100" cy="32" r="7"/>
    <circle cx="170" cy="22" r="6"/>
    <circle cx="30" cy="22" r="6"/>
    <rect x="45" y="115" width="110" height="12" rx="3" fill="url(#goldGrad2)"/>
    <circle cx="65" cy="121" r="3" fill="#072a1e"/>
    <circle cx="100" cy="121" r="3" fill="#072a1e"/>
    <circle cx="135" cy="121" r="3" fill="#072a1e"/>
  </g>

  <!-- Monogram KU -->
  <g id="monogram" text-anchor="middle">
    <!-- Letter K -->
    <text x="175" y="235" font-family="Playfair Display, Georgia, serif" font-size="120" font-weight="700" fill="url(#goldGrad1)" filter="url(#glow)">K</text>
    <!-- Letter U interlaced -->
    <text x="228" y="248" font-family="Playfair Display, Georgia, serif" font-size="110" font-weight="700" fill="url(#goldGrad2)" opacity="0.95">U</text>
  </g>

  <!-- Wreath laurels left and right -->
  <g fill="url(#goldGrad1)" opacity="0.85">
    <!-- Left laurel -->
    <path d="M 68 180 C 65 140 85 105 110 85 C 105 98 102 115 105 130 C 95 125 80 145 82 165 C 75 165 70 172 68 180 Z"/>
    <path d="M 65 210 C 62 250 82 285 110 305 C 104 290 102 270 105 255 C 92 260 78 240 80 220 Z"/>
    <!-- Right laurel -->
    <path d="M 332 180 C 335 140 315 105 290 85 C 295 98 298 115 295 130 C 305 125 320 145 318 165 C 325 165 330 172 332 180 Z"/>
    <path d="M 335 210 C 338 250 318 285 290 305 C 296 290 298 270 295 255 C 308 260 322 240 320 220 Z"/>
  </g>

  <!-- Circular stars -->
  <circle cx="120" cy="195" r="3" fill="url(#goldGrad1)"/>
  <circle cx="280" cy="195" r="3" fill="url(#goldGrad1)"/>

  <!-- Brand Subtext -->
  <text x="200" y="295" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="9" fill="#FFF2B2" text-anchor="middle">KISHSASHI</text>
  <text x="200" y="318" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" letter-spacing="7" fill="url(#goldGrad1)" text-anchor="middle">URBANCHIC</text>
  <text x="200" y="336" font-family="Inter, sans-serif" font-size="7.5" font-weight="500" letter-spacing="4" fill="#E5C158" opacity="0.8" text-anchor="middle">COLOMBO &bull; CEYLON</text>
</svg>